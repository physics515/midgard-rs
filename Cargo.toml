[package]
name = "midgard-rs"
version = "0.2.0"
edition = "2021"
categories = ["api-bindings", "cryptography::cryptocurrencies"]
license = "MIT"
keywords = ["thorswap", "midgard", "thorchain", "api"]
readme = "README.md"
description = "Thorchain Midgard API client for Rust"
repository = "https://github.com/physics515/midgard-rs"
documentation = "https://docs.rs/midgard-rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# `default-features = false` drops reqwest's default `native-tls` backend,
# which links OpenSSL — a C library, and this crate is 100% Rust with no
# FFI. `rustls-tls` is the pure-Rust replacement and bundles the webpki
# root store, so it does not depend on a system certificate store either.
# `charset`, `http2` and `json`-free defaults are re-added by hand; the
# crate parses JSON itself with serde_json, so `json` is deliberately off.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
thiserror = { version = "1" }
serde_json = { version = "1" }
tokio = { version = "1", default-features = false, features = ["time"] }
serde_urlencoded = { version = "0.7" }
serde-aux = { version = "4" }
chrono = { version = "0.4", features = ["serde"] }
serde_with = { version = "3", features = ["chrono"] }
rust_decimal = { version = "1", features = ["serde", "serde-str"] }

[dev-dependencies]
# Test-only. `rand` is used by the randomised endpoint tests and `tokio-test`
# by the doc-tests; both used to be normal dependencies, which every consumer
# of this library paid for. `cargo build` warned about both by name.
rand = { version = "0.8" }
tokio-test = { version = "0.4" }
# The library needs only `time` (for the rate limiter's sleep); the test
# harness additionally needs the `#[tokio::test]` macro and a runtime to
# drive it.
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt", "rt-multi-thread"] }
